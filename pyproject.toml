[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diy-jev"
version = "0.1.0"
description = "A confidence-aware CommonsenseQA decision system"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers",
  "datasets",
  "peft",
  "tqdm",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
